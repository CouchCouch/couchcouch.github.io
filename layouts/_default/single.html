{{ define "main" }}
<div class="container page-content">
  <h1>{{ .Title }}</h1>
  {{ if .Date }}
    <div class="page-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    </div>
  {{ end }}
  <div class="content-body">
    {{ .Content }}
  </div>
</div>
{{ end }}
