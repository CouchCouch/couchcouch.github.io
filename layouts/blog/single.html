{{ define "main" }}
<article class="container page-content">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{ with .Params.tags }}
        <div class="post-tags">
          {{ range . }}
            <a href="{{ "/tags/" | relURL }}{{ . | urlize }}" class="tag">#{{ . }}</a>
          {{ end }}
        </div>
      {{ end }}
    </div>
  </header>
  <div class="content-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
